name: Continuous Integration

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin-frontend: ${{ steps.filter.outputs.admin-frontend }}
      student-frontend: ${{ steps.filter.outputs.student-frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            admin-frontend:
              - 'frontend/**'
            student-frontend:
              - 'student-frontend/**'

  test-backend:
    name: "Backend — Test"
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: atoms_lms_test
          POSTGRES_USER: atoms_lms_user
          POSTGRES_PASSWORD: atoms_lms_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: cd backend && mvn verify -q

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  test-admin-frontend:
    name: "Admin Frontend — Lint & Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.admin-frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint --if-present

      - name: Build
        run: cd frontend && npm run build

  test-student-frontend:
    name: "Student Frontend — Lint & Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.student-frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: student-frontend/package-lock.json

      - name: Install dependencies
        run: cd student-frontend && npm ci

      - name: Lint
        run: cd student-frontend && npm run lint --if-present

      - name: Build
        run: cd student-frontend && npm run build

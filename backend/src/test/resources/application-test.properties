# ========================================
# TEST ENVIRONMENT OVERRIDES
# Overrides only what differs from main application.properties.
# The main config is inherited; only test-specific values are set here.
# All secrets below are DUMMY values — safe to commit, never used in prod.
# ========================================

# ----------------------------------------
# Database — points to GitHub Actions PostgreSQL service (port 5432)
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/atoms_lms_test
spring.datasource.username=atoms_lms_user
spring.datasource.password=atoms_lms_user
spring.liquibase.contexts=test

# ----------------------------------------
# Required secrets — dummy values for test context to load
# ----------------------------------------
app.jwt.secret=test-only-secret-key-for-unit-tests-not-used-in-production-padding-here
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.mail.username=test@example.com
spring.mail.password=test-password
judge0.api.key=test-judge0-key
mailgun.api.key=test-mailgun-key
vdocipher.api.key=test-vdocipher-key
vdocipher.api.webhook-secret-token=test-vdocipher-webhook-secret
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=test-razorpay-secret
aisensy.api.key=test-aisensy-key
digitalocean.spaces.access-key=test-do-access-key
digitalocean.spaces.secret-key=test-do-secret-key

# ----------------------------------------
# HikariCP — minimal pool for tests
# ----------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# ----------------------------------------
# Thread pools — no need for production scale in tests
# ----------------------------------------
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=10

# ----------------------------------------
# Suppress noise in test output
# ----------------------------------------
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.springframework=WARN
logging.level.liquibase=WARN

spring.application.name=atoms

spring.config.import=optional:file:.env[.properties]

info.app.name=Atoms LMS
info.app.description=Learning Management System for abc-courses
info.app.version=1.0.0-SNAPSHOT
info.app.java.version=${java.version}
info.build.time=${build.time:@project.timestamp@}
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/atoms_lms}
spring.datasource.username=${DB_USERNAME:atoms_lms_user}
spring.datasource.password=${DB_PASSWORD:atoms_lms_user}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=75
spring.datasource.hikari.minimum-idle=25
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=45000
spring.datasource.hikari.pool-name=HikariPoolLMS-Optimized
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.cache-prep-stmts=true
spring.datasource.hikari.prep-stmt-cache-size=512
spring.datasource.hikari.prep-stmt-cache-sql-limit=2048

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=512
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.session.events.log=false

spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.default-schema=public
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:dev}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m
spring.cache.cache-names=courses,content-items,curriculums,featured-courses,instructor-courses

spring.task.execution.pool.core-size=20
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=lms-async-
spring.task.execution.pool.keep-alive=60s
spring.task.execution.pool.allow-core-thread-timeout=true
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=60s

server.port=9080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
server.http2.enabled=true
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=10000
server.tomcat.max-threads=300
server.tomcat.min-spare-threads=20
server.servlet.session.timeout=45m
spring.session.store-type=none

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

logging.level.org.springframework=WARN
logging.level.courses.abc.atoms=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.engine=WARN
logging.level.org.hibernate.internal=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,metrics,info,caches
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true
management.endpoint.caches.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=50ms,100ms,200ms,300ms
management.metrics.enable.jvm=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.jwt.clock-skew=300000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

judge0.api.url=https://judge0-ce.p.rapidapi.com
judge0.api.key=${JUDGE0_API_KEY:}
judge0.api.host=judge0-ce.p.rapidapi.com
judge0.api.timeout=30
judge0.api.max-batch-size=20

mailgun.api.key=${MAILGUN_API_KEY:}
mailgun.domain=atoms.abc.courses
mailgun.from.email=noreply@atoms.abc.courses
mailgun.from.name=ABC Courses

vdocipher.api.key=${VDOCIPHER_API_KEY:}
vdocipher.api.url=https://dev.vdocipher.com
vdocipher.api.webhook-secret-token=${VDOCIPHER_WEBHOOK_SECRET:}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

file.upload-dir=${FILE_UPLOAD_DIR:../uploads}
aisensy.api.key=${AISENSY_API_KEY:}
aisensy.api.url=https://backend.aisensy.com/campaign/t1/api/v2
app.base-url=${APP_BASE_URL:http://localhost:9080}

digitalocean.spaces.access-key=${DO_SPACES_ACCESS_KEY:}
digitalocean.spaces.secret-key=${DO_SPACES_SECRET_KEY:}
digitalocean.spaces.region=sgp1
digitalocean.spaces.endpoint=https://sgp1.digitaloceanspaces.com
digitalocean.spaces.bucket=abc-courses-media
digitalocean.spaces.cdn-endpoint=https://abc-courses-media.sgp1.cdn.digitaloceanspaces.com

image.max-input-bytes=5242880
image.thumbnail.max-width=800
image.thumbnail.max-height=600
image.thumbnail.webp-quality=0.82
image.profile.size=256
image.profile.webp-quality=0.85
image.allowed-types=image/jpeg,image/png,image/webp,image/gif
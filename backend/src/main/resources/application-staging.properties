spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:prod}
spring.liquibase.liquibase-schema=public
spring.liquibase.url=${DB_DIRECT_URL}
spring.liquibase.user=${DB_USERNAME}
spring.liquibase.password=${DB_PASSWORD}

logging.level.courses.abc.atoms=INFO
logging.level.org.springframework=WARN
logging.file.name=/var/log/atoms/staging.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=7

management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

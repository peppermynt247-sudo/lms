spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origins=${ALLOWED_ORIGINS}

spring.datasource.hikari.maximum-pool-size=35
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

spring.liquibase.contexts=prod
spring.liquibase.liquibase-schema=public
spring.liquibase.url=${DB_URL}
spring.liquibase.user=${DB_USERNAME}
spring.liquibase.password=${DB_PASSWORD}

logging.level.courses.abc.atoms=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.file.name=/var/log/atoms/production.log
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

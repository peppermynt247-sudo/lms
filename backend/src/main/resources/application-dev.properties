spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/atoms_lms}
spring.datasource.username=${DB_USERNAME:atoms_lms_user}
spring.datasource.password=${DB_PASSWORD:atoms_lms_user}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

spring.liquibase.contexts=dev

logging.level.courses.abc.atoms=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

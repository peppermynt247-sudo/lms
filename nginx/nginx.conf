worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;
    client_max_body_size 20M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=30s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    upstream backend_api {
        server backend:9080;
    }

    upstream admin_frontend {
        server admin-frontend:3001;
    }

    upstream student_frontend {
        server student-frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.abc.courses;

        ssl_certificate     /etc/letsencrypt/live/api.abc.courses/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.abc.courses/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        add_header X-Frame-Options           "DENY"                                     always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"       always;
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass          http://backend_api;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
            proxy_send_timeout  90s;
            proxy_connect_timeout 30s;
        }

        # Strict rate limit only on auth-mutation endpoints (login, register, password flows)
        location ~ ^/api/user/(login|register|forgotpassword|verifyotp|resetpassword|updatepassword)$ {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass          http://backend_api;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
            proxy_send_timeout  90s;
            proxy_connect_timeout 30s;
        }

        # All other /api/user/* endpoints (logout, profile, session, etc.) use the general API limit
        location /api/user/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass          http://backend_api;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
            proxy_send_timeout  90s;
            proxy_connect_timeout 30s;
        }

        location /actuator/ {
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny  all;

            proxy_pass http://backend_api;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name admin.abc.courses;

        ssl_certificate     /etc/letsencrypt/live/api.abc.courses/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.abc.courses/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        add_header X-Frame-Options           "SAMEORIGIN"                               always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"       always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://abc-courses-media.sgp1.cdn.digitaloceanspaces.com; font-src 'self' data:; connect-src 'self' https://api.abc.courses; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location / {
            proxy_pass          http://admin_frontend;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.abc.courses;

        ssl_certificate     /etc/letsencrypt/live/api.abc.courses/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.abc.courses/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        add_header X-Frame-Options           "SAMEORIGIN"                               always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"       always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://abc-courses-media.sgp1.cdn.digitaloceanspaces.com; font-src 'self' data:; connect-src 'self' https://api.abc.courses; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location / {
            proxy_pass          http://student_frontend;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
        }
    }
}

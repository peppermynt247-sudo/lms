worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 20M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    upstream backend_api {
        server backend:9080;
    }

    server {
        listen 80;
        server_name staging-api.abc.courses;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name staging-api.abc.courses;

        ssl_certificate     /etc/letsencrypt/live/staging-api.abc.courses/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-api.abc.courses/privkey.pem;
        include /etc/nginx/ssl-params.conf;

        add_header X-Frame-Options           "DENY"                                     always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"       always;
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass          http://backend_api;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  90s;
            proxy_send_timeout  90s;
            proxy_connect_timeout 30s;
        }

        # Strict rate limit only on auth-mutation endpoints (login, register, password flows)
        location ~ ^/api/user/(login|register|forgotpassword|verifyotp|resetpassword|updatepassword)$ {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass          http://backend_api;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        # All other /api/user/* endpoints (logout, profile, session, etc.) use the general API limit
        location /api/user/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass          http://backend_api;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        location /actuator/ {
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny  all;

            proxy_pass http://backend_api;
        }
    }
}

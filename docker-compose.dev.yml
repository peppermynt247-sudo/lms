services:

  postgres:
    image: postgres:13
    container_name: atoms-lms-db
    environment:
      POSTGRES_DB: atoms_lms
      POSTGRES_USER: atoms_lms_user
      POSTGRES_PASSWORD: atoms_lms_user
      PGTZ: Asia/Kolkata
      TZ: Asia/Kolkata
    ports:
      - "5433:5432"   # host:container — use 5433 to avoid conflicts with any local postgres
    volumes:
      - atoms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoms_lms_user -d atoms_lms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atoms-lms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@abc.courses
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"     # open http://localhost:5050 in browser
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  atoms_postgres_data:
    driver: local
